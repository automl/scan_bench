[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-bench"
version = "0.2.0"
description = "Surrogate benchmark suite (VLM, LLM, TabPFN) for cheap evaluation of scaling analysis methods"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "xgboost==3.1.3",
    "scikit-learn==1.7.2",
    "tabpfn==7.1.1",
    "matplotlib",
    "seaborn",
    "torch==2.9.1",
    "tqdm",
    "autogluon==1.5.0",
    "lightgbm==4.6.0"
]

[tool.setuptools.packages.find]
include = [
    "scan_bench",
    "scan_bench.commons",
    "scan_bench.commons.*",
    "scan_bench.vlm",
    "scan_bench.vlm.*",
    "scan_bench.llm",
    "scan_bench.llm.*",
    "scan_bench.tabpfn",
    "scan_bench.tabpfn.*",
]

exclude = [
    "scan_bench.commons.plotting",
    "scan_bench.commons.train",
    "scan_bench.*.performance_surrogate.results",
    "scan_bench.vlm.divergence_surrogate.results",
    "scan_bench.*.performance_surrogate.train",
]

[tool.setuptools.package-data]
"scan_bench.vlm" = ["*.json", "*.csv"]
"scan_bench.vlm.performance_surrogate" = ["splits/*.csv"]
"scan_bench.vlm.divergence_surrogate" = ["xgb_models/*.json"]
"scan_bench.llm" = ["splits/*.csv", "*.csv", "*.json"]
"scan_bench.tabpfn" = ["*.json", "*.csv"]
